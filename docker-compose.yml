services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: voidtune-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx1G
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml
    ports:
      - "2333:2333"

  # PostgreSQL and Redis services will be activated in Phase 4
